kind: state-definition
id: validity
version: 2
description: Authenticated datum integrity across compatible package selections.
subject_as: subject
cardinality: exactly-one
default: valid
values:
- valid
- invalid
rules:
- value: invalid
  priority: 100
  when: subject.integrity.parseable == false || subject.integrity.schema_valid == false || subject.integrity.identity_valid
    == false || subject.integrity.references_valid == false || subject.integrity.hash_valid == false || subject.integrity.transaction_valid == false
  explanation: Invalid integrity or an unauthenticated publication transaction.
