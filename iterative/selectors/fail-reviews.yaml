kind: selector-definition
id: fail-reviews
version: 2
description: fail reviews
parameters:
- name: subject
  kind: revision
result_kind: revision
query:
  from:
    relation: incoming-links
    of: subject
    link: reviews
    emit: source
    types:
    - REV
  as: item
  where: >-
    state(item, "validity") == "valid" && item.integrity.transaction_valid == true && none("superseding-reviews@1", {review: item}) && item.payload.outcome
    == "fail"
  distinct: true
  order_by:
  - identity.revision_id
