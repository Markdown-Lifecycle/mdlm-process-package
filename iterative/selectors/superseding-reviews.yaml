kind: selector-definition
id: superseding-reviews
version: 1
description: Explicit replacement judgments
parameters:
- name: review
  kind: revision
  types:
  - REV
result_kind: revision
query:
  from:
    relation: incoming-links
    of: review
    link: supersedes
    emit: source
    types:
    - REV
  as: item
  where: state(item, "validity") == "valid" && item.integrity.transaction_valid == true
  distinct: true
  order_by:
  - identity.revision_id
