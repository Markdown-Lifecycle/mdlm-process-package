kind: type-definition
id: DPL
version: 1
name: Deployment
description: One kernel-attested AWS CDK deployment of one exact product revision (ADR-0009). The deployment action fixes its settings; the kernel fills the rest from the deployment receipt.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
    - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
    - publication
    - synth_image
    - cdk_cli_version
    - cdk_app_path
    - region
    - apm_project
    - stack_slots
    - output_allowlist
    - endpoint_output
    - probe_path
    - max_lifetime_minutes
    - outcome
    - receipt
  properties:
    publication:
      const: recorded
    synth_image: &text
      type: string
      minLength: 1
    cdk_cli_version: *text
    cdk_app_path: *text
    region: *text
    apm_project: *text
    stack_slots: &names
      type: array
      minItems: 1
      items: *text
    output_allowlist: *names
    endpoint_output: *text
    probe_path: *text
    max_lifetime_minutes:
      type: integer
      minimum: 1
    outcome:
      enum:
        - pass
        - error
    receipt: *text
    stack:
      type: object
    outputs:
      type: object
    endpoint: *text
    deployed_version: *text
    expires_at: *text
outgoing_links:
  - id: deploys
    description: Exact product revision whose source commit was deployed.
    targets:
      - kind: datum
        types:
          - IMP
        identity: revision
    cardinality:
      minimum: 1
      maximum: 1
    freeze_resolution: already-exact
    inverse_label: incoming-deploys
kernel_managed_payload_paths:
  - outcome
  - receipt
  - stack
  - outputs
  - endpoint
  - deployed_version
  - expires_at
