kind: action-definition
id: review-requirements
version: 28
description: Review requirements
capability: review
prompt_ref: prompts/review-requirements.md@35
types:
- REV
subjects: select("current-requirements@1", {})
inputs:
  interfaces: 'select("selected-interfaces@2", {requirements: subject})'
  subject: subject
when: '!(exists("reviews-for@2", {subject: subject})) && none("reusable-requirements-review@2", {requirements: subject})'
priority: 100
links:
  REV:
    reviews: subject
fixed_payload:
  REV:
    publication: recorded
authority:
  kind: independent-review
  name: independent-reviewer
